  <a href="{{ '/assets/diagrams/board.svg' | relative_url }}"><img src="{{ '/assets/diagrams/board.svg' | relative_url }}" alt="Board flow: Triage to Backlog when the human decides and a brief is written; Triage to Active when the human moves the issue there; Backlog to Active when the issue is assigned to the swarm and a draft pull request opens; the pull request card starts in In Progress; In Progress to Needs Input when a human must answer a question, and back when the human moves the card; In Progress to Auto Review when the pre-check passes; Auto Review back to In Progress on a P1 or P2 finding, to Pending when the pull request waits for a slot or for another pull request, to Human Review when it is clean, post-checked, has green Linux checks and screenshots; Pending to Human Review when a slot opens and the gate passes; Human Review holds two pull requests; Human Review back to In Progress when the human moves the card or on a late finding, or to Done when the human merges."></a>
  <figcaption>The board: what moves a card from one column to the next.</figcaption>
</figure>
