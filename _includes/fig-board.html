  <a href="{{ '/assets/diagrams/board.svg' | relative_url }}"><img src="{{ '/assets/diagrams/board.svg' | relative_url }}" alt="Board flow: Triage to Backlog when the human decides and a brief is written; Triage to Active when the human moves the issue there; Backlog to Active when the issue is assigned to the swarm and a draft pull request opens; the pull request card starts in In Progress; In Progress to Needs Input when a human must answer a question, and back when the human moves the card; In Progress to Auto Review when the pre-check passes; Auto Review back to In Progress on a P1 or P2 finding, or to Ready when the review is clean and the post-check passes; Ready to Staging when the pull request is merged, deployed, and gated, one at a time; Staging holds a buffer of 3 to 5 fully prepared pull requests; Staging to Human Review when a slot opens, as a card move; Human Review holds exactly two pull requests; Human Review back to In Progress when the human moves the card or on a late finding, or to Done when the human merges."></a>

  <figcaption>The board: what moves a card from one column to the next.</figcaption>
